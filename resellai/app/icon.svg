<!--
  Home-screen icon source.

  iOS masks apple-touch-icon into its own squircle, so this is drawn full-bleed with square
  corners and no padding of its own — rounding it here would show as a dark ring inside the mask.

  apple-touch-icon.png is rendered from this file; edit the SVG and re-render, never the PNG.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5" />
      <stop offset="1" stop-color="#7C3AED" />
    </linearGradient>
    <!-- The highlight iOS icons tend to carry, kept faint so the mark stays the focus. -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="0.58" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="180" height="180" fill="url(#ground)" />
  <rect width="180" height="180" fill="url(#sheen)" />

  <!--
    Price tag, tilted slightly off-axis so it reads as an object rather than a diagram.
    Drawn at 24×24 and scaled 3.85× (~92px on a 180px canvas). The mark deliberately occupies
    barely half the width: iOS crops the corners into a squircle, and anything larger reads as
    cramped against the mask at the 60pt size this actually renders at on a home screen.
  -->
  <g transform="translate(90 90) rotate(-8) scale(3.85) translate(-12 -12)">
    <path
      fill="#FFFFFF"
      d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58s1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41s-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z"
    />
  </g>
</svg>
